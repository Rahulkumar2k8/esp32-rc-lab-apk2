name: Build ESP32 RC Wokwi Lab V6 Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'source/v6/**'
      - '.github/workflows/build-v6-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble and verify uploaded V6 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat source/v6/zip-parts/part-*.b64 > /tmp/v6-source.zip.b64
          base64 --decode /tmp/v6-source.zip.b64 > /tmp/v6-source.zip
          echo "3286573baf850bd157c0a99f02f5d28e53a2388bcb4a8a2cc073bbded3fd3bf8  /tmp/v6-source.zip" | sha256sum --check -
          unzip -q /tmp/v6-source.zip -d .
          test -f esp32_rc_wokwi_lab_android/www/index.html
          test -f esp32_rc_wokwi_lab_android/package.json

      - name: Install Python and Arduino CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile built-in ESP32 preset firmware
        working-directory: esp32_rc_wokwi_lab_android
        run: python3 scripts/build_preset_bins.py

      - name: Install Capacitor and configure Android USB-OTG serial
        working-directory: esp32_rc_wokwi_lab_android
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npx cap add android
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/java/com/esp32rc/wokwilab
          cp usb_otg/device_filter.xml android/app/src/main/res/xml/device_filter.xml
          cp android_native/UsbSerialBridge.java android/app/src/main/java/com/esp32rc/wokwilab/UsbSerialBridge.java
          cp android_native/MainActivity.java android/app/src/main/java/com/esp32rc/wokwilab/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")
          build_file = root / "build.gradle"
          text = build_file.read_text()
          if "jitpack.io" not in text:
              text = text.replace(
                  "mavenCentral()",
                  'mavenCentral()\n        maven { url "https://jitpack.io" }',
              )
              build_file.write_text(text)

          app_gradle = root / "app" / "build.gradle"
          text = app_gradle.read_text()
          if "usb-serial-for-android" not in text:
              text = text.replace(
                  "dependencies {",
                  'dependencies {\n    implementation "com.github.mik3y:usb-serial-for-android:3.8.0"',
                  1,
              )
              app_gradle.write_text(text)

          manifest = root / "app" / "src" / "main" / "AndroidManifest.xml"
          text = manifest.read_text()
          if "android.hardware.usb.host" not in text:
              text = text.replace(
                  "<application",
                  '<uses-feature android:name="android.hardware.usb.host" android:required="false" />\n    <application',
                  1,
              )
              manifest.write_text(text)
          PY

          npx cap sync android

      - name: Build debug APK
        working-directory: esp32_rc_wokwi_lab_android/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32_RC_Wokwi_Lab_V6_APK
          path: esp32_rc_wokwi_lab_android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
